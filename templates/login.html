{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">📓</div>
    <h1>Welcome back</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Sign in to your account</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Your username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Your password" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
            <input type="checkbox" name="remember" id="remember" style="width: auto; margin: 0;">
            <label for="remember" style="margin: 0; cursor: pointer;">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <div class="auth-links">
        <p><a href="/reset-password-request">Forgot password?</a></p>
        <p>No account? <a href="/register">Register here</a></p>
    </div>
</div>
{% endblock %}
