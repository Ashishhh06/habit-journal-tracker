{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🌱</div>
    <h1>Create Account</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Start tracking your habits today</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required autofocus>
        </div>
        <div class="form-group">
            <label>Email (optional)</label>
            <input type="email" name="email" placeholder="for password resets">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Choose a strong password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <div class="auth-links">
        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}
