<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}{% endblock %} - Habit Journal Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Load Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">HabitJournal</div>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <a href="/">Dashboard</a>
                <a href="/habits">Habits</a>
                <a href="/timetable">Timetable</a>
                <a href="/stats">Stats</a>
                <a href="/goals">Goals</a>
                <a href="/journal">Journal</a>
                <a href="/analytics">Analytics</a>
                <a href="/logout" class="btn btn-secondary btn-small" style="margin-left: 1.5rem;">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
    
    <div id="toast-container"></div>

    <script>
        // Global Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const text = document.createElement('span');
            text.textContent = message;
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'toast-close';
            closeBtn.innerHTML = '&times;';
            closeBtn.onclick = () => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            };
            
            toast.appendChild(text);
            toast.appendChild(closeBtn);
            container.appendChild(toast);
            
            // Auto remove after 4 seconds
            setTimeout(() => {
                if(toast.parentElement) {
                    toast.classList.add('fade-out');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // Display flashed messages from Flask via JS Toasts
        document.addEventListener('DOMContentLoaded', () => {
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        showToast("{{ message }}");
                    {% endfor %}
                {% endif %}
            {% endwith %}
        });
        
        // Setup CSRF token for fetch requests
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    </script>
</body>
</html>
